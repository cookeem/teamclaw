<v-container class="page-wrap py-6" fluid>
  <v-card class="panel-card pa-3">
    <v-card-title class="d-flex flex-wrap align-center ga-2">
      <span class="text-h6 font-weight-bold mr-4">{{ t("admin.audit.title") }}</span>
      <v-text-field v-model="action" :label="t('admin.audit.action')" density="compact" variant="outlined" hide-details />
      <v-select
        v-model="result"
        :items="resultItems"
        :label="t('admin.audit.result')"
        density="compact"
        variant="outlined"
        hide-details
        style="max-width: 160px"
      />
      <v-btn color="primary" variant="outlined" @click="load">{{ t("admin.audit.filter") }}</v-btn>
    </v-card-title>

    <v-data-table
      :headers="headers"
      :items="logs"
      item-value="id"
      :loading="loading"
      class="elevation-0"
      density="comfortable"
    >
      <template #item.created_at="{ item }">{{ fmt(item.created_at) }}</template>
      <template #item.detail_json="{ item }">
        <code class="detail-preview">{{ preview(item.detail_json) }}</code>
      </template>
    </v-data-table>

    <v-alert v-if="errorText" type="error" variant="tonal" class="mt-3">{{ errorText }}</v-alert>
  </v-card>
</v-container>
