<v-container class="page-wrap py-6" fluid>
  <v-row justify="center">
    <v-col cols="12" md="8" lg="6">
      <v-card class="panel-card pa-4">
        <v-card-title class="text-h6 font-weight-bold">{{ t("admin.editUser.title") }}</v-card-title>
        <v-card-subtitle>{{ t("admin.editUser.userId") }}: <code>{{ userId }}</code></v-card-subtitle>

        <v-card-text class="d-flex flex-column ga-3 mt-2">
          <v-text-field v-model="form.username" :label="t('admin.editUser.username')" variant="outlined" />
          <v-text-field v-model="form.display_name" :label="t('admin.editUser.displayName')" variant="outlined" />
          <v-switch v-model="form.is_admin" :label="t('admin.editUser.admin')" color="primary" inset hide-details />
          <v-switch v-model="form.is_blocked" :label="t('admin.editUser.blocked')" color="error" inset hide-details />

          <v-alert v-if="errorText" type="error" variant="tonal">{{ errorText }}</v-alert>
          <v-alert v-if="successText" type="success" variant="tonal">{{ successText }}</v-alert>

          <div class="d-flex ga-2">
            <v-btn color="primary" :loading="saving" @click="save">{{ t("admin.editUser.save") }}</v-btn>
            <v-btn variant="text" @click="goBack">{{ t("admin.editUser.back") }}</v-btn>
          </div>
        </v-card-text>
      </v-card>
    </v-col>
  </v-row>
</v-container>
